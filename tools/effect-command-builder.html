<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Build Minecraft Bedrock effect commands visually. Generate /effect commands with all parameters.">
  <meta name="author" content="Mukund">
  <meta name="theme-color" content="#0a0a0f">
  <title>Effect Command Builder - AntigleForge</title>
  <link rel="canonical" href="https://antigleforge.pages.dev/tools/effect-command-builder">
  
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://antigleforge.pages.dev/tools/effect-command-builder">
  <meta property="og:title" content="Effect Command Builder - AntigleForge">
  <meta property="og:description" content="Build Minecraft Bedrock /effect commands visually.">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@300;400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="../assets/css/style.css">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../assets/images/logo.png">
  
  <style>
    .effect-select-wrap { position: relative; }
    .effect-search {
      width: 100%;
      padding-right: 2rem;
    }
    .effect-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      max-height: 200px;
      overflow-y: auto;
      background: #1a1a24;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      z-index: 10;
      display: none;
    }
    .effect-dropdown.open { display: block; }
    .effect-option {
      padding: 0.5rem 0.75rem;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      color: #ccc;
      transition: background 0.1s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .effect-option:hover { background: rgba(0,221,255,0.1); }
    .effect-option.selected { background: rgba(0,221,255,0.15); color: #00ddff; }
    .effect-option .eff-icon { font-size: 1rem; }
    .effect-option .eff-name { flex: 1; }
    .effect-option .eff-type { font-size: 0.65rem; color: rgba(255,255,255,0.3); text-transform: uppercase; }
    .effect-preview {
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px;
      padding: 1rem;
      margin-top: 1rem;
    }
    .effect-preview-name {
      font-family: 'Oxanium', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .effect-preview-desc {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.4);
      margin-top: 0.3rem;
    }
    .effect-preview-info {
      display: flex;
      gap: 1rem;
      margin-top: 0.5rem;
      flex-wrap: wrap;
    }
    .eff-info-item {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.3);
    }
    .eff-info-item strong { color: rgba(255,255,255,0.5); }
    .command-output {
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 0.8rem;
      position: relative;
      margin-top: 1rem;
    }
    .command-output pre {
      margin: 0;
      font-family: 'Inter', monospace;
      font-size: 0.8rem;
      color: #55ff55;
      word-break: break-all;
      white-space: pre-wrap;
    }
    .copy-cmd-btn {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
    }
    .target-presets {
      display: flex;
      gap: 0.3rem;
      flex-wrap: wrap;
      margin-top: 0.4rem;
    }
    .target-preset {
      padding: 0.3rem 0.6rem;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 5px;
      background: rgba(255,255,255,0.03);
      color: rgba(255,255,255,0.4);
      font-family: 'Oxanium', sans-serif;
      font-size: 0.65rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.12s;
    }
    .target-preset:hover { border-color: rgba(0,221,255,0.3); color: #00ddff; }
    .target-preset.active { background: rgba(0,221,255,0.12); border-color: rgba(0,221,255,0.3); color: #00ddff; }
    .clear-mode-toggle {
      display: flex;
      gap: 0.3rem;
      margin-bottom: 1rem;
    }
    .clear-btn {
      padding: 0.4rem 0.8rem;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      background: rgba(255,255,255,0.03);
      color: rgba(255,255,255,0.4);
      font-family: 'Oxanium', sans-serif;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.12s;
    }
    .clear-btn.active { background: rgba(255,85,85,0.12); border-color: rgba(255,85,85,0.3); color: #ff5555; }
    .clear-btn:hover:not(.active) { border-color: rgba(255,255,255,0.2); color: rgba(255,255,255,0.6); }
    .form-row { display: flex; gap: 0.75rem; flex-wrap: wrap; }
    .form-row > * { flex: 1; min-width: 120px; }
  </style>
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar" role="navigation" aria-label="Main navigation">
    <div class="navbar-container">
      <a href="../index.html" class="navbar-brand">
        <img src="../assets/images/logo.png" alt="AntigleForge" class="brand-logo">
        <span class="brand-text">Antigle<span class="brand-accent">Forge</span></span>
      </a>
      
      <button class="hamburger" id="hamburger" aria-label="Toggle menu" aria-expanded="false">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </button>
      
      <ul class="navbar-nav" id="navbar-nav">
        <li><a href="../index.html" class="nav-link">Home</a></li>
        <li><a href="../tools.html" class="nav-link active">Tools</a></li>
      </ul>
      
      <div class="navbar-actions">
        <a href="https://youtube.com/@notgamingplayz" target="_blank" rel="noopener noreferrer" class="btn btn-social" aria-label="YouTube">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.872.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.016 3.016 0 0 0 2.122-2.136c.502-1.884.502-5.814.502-5.814s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
          </svg>
        </a>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main id="main-content" class="main-content">
    <section class="tool-page">
      <div class="container">
        <div class="tool-header reveal">
          <h1 class="tool-title">Effect Command Builder</h1>
          <p class="tool-subtitle">Build Minecraft Bedrock /effect commands visually. Give or clear effects on players and entities.</p>
        </div>

        <div class="tool-container">
          <div class="tool-card-main reveal stagger-1">
            <div class="tool-card-header">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
              </svg>
              Effect Command Builder
            </div>

            <!-- Mode: Give or Clear -->
            <div class="clear-mode-toggle" id="modeToggle">
              <button class="clear-btn active" data-mode="give">Give Effect</button>
              <button class="clear-btn" data-mode="clear-one">Clear Specific Effect</button>
              <button class="clear-btn" data-mode="clear-all">Clear All Effects</button>
            </div>

            <!-- Target -->
            <div class="form-group">
              <label class="form-label" for="targetInput">Target</label>
              <input type="text" id="targetInput" class="form-input" value="@s" placeholder="@s, @a, @p, player_name">
              <div class="target-presets" id="targetPresets">
                <button class="target-preset active" data-target="@s">@s (self)</button>
                <button class="target-preset" data-target="@a">@a (all)</button>
                <button class="target-preset" data-target="@p">@p (nearest)</button>
                <button class="target-preset" data-target="@e">@e (all entities)</button>
                <button class="target-preset" data-target="@r">@r (random)</button>
              </div>
            </div>

            <!-- Effect selection (hidden in clear-all mode) -->
            <div id="effectFields">
              <div class="form-group effect-select-wrap">
                <label class="form-label" for="effectSearch">Effect</label>
                <input type="text" id="effectSearch" class="form-input effect-search" placeholder="Search effects..." autocomplete="off">
                <div class="effect-dropdown" id="effectDropdown"></div>
              </div>

              <!-- Duration & Amplifier (hidden for instant effects) -->
              <div class="form-row" id="durationRow">
                <div class="form-group">
                  <label class="form-label" for="durationInput">Duration (seconds)</label>
                  <input type="number" id="durationInput" class="form-input" value="30" min="0" max="100000" placeholder="30">
                </div>
                <div class="form-group">
                  <label class="form-label" for="amplifierInput">Amplifier (0-255)</label>
                  <input type="number" id="amplifierInput" class="form-input" value="0" min="0" max="255" placeholder="0">
                </div>
              </div>

              <!-- Hide particles -->
              <div class="form-group">
                <label class="form-label" style="display:flex;align-items:center;gap:0.5rem;cursor:pointer;">
                  <input type="checkbox" id="hideParticles" style="width:16px;height:16px;">
                  Hide Particles
                </label>
              </div>
            </div>

            <!-- Effect Preview -->
            <div class="effect-preview" id="effectPreview">
              <div class="effect-preview-name" id="previewName">Select an effect above</div>
              <div class="effect-preview-desc" id="previewDesc"></div>
              <div class="effect-preview-info" id="previewInfo"></div>
            </div>

            <!-- Generated Command -->
            <div class="command-output" id="commandOutput">
              <pre id="commandText"></pre>
              <button class="btn btn-primary copy-cmd-btn" id="copyCmdBtn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
                Copy
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Scripts -->
  <script src="../assets/js/performance.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/components.js"></script>
  <script>
  AntigleComponents.init([
    { q: 'What is the /effect command syntax?', a: 'Bedrock syntax: /effect <target> <effect> [duration] [amplifier] [hideParticles]. Duration is in seconds (default 30), amplifier starts at 0 (default), and hideParticles is true/false (default false).' },
    { q: 'What amplifier values are there?', a: 'Amplifier 0 = level I, amplifier 1 = level II, amplifier 2 = level III, etc. The maximum is 255 (level 256). Higher amplifiers have stronger effects but some have diminishing returns.' },
    { q: 'How do I clear effects?', a: 'Use /effect <target> clear to remove all effects from a target. Use /effect <target> <effect> clear to remove a specific effect only.' },
    { q: 'Are all effects the same on Bedrock?', a: 'Most effects work identically on Bedrock and Java, but some have minor differences in duration or amplifier behavior. This tool generates Bedrock-specific syntax.' }
  ]);

  // Backup FAQ handler
  document.addEventListener('click', function(e) {
    var q = e.target.closest('.faq-question');
    if (!q) return;
    var item = q.parentElement;
    var wasOpen = item.classList.contains('open');
    item.parentElement.querySelectorAll('.faq-item').forEach(function(i) { i.classList.remove('open'); });
    if (!wasOpen) item.classList.add('open');
  });
  </script>
  <script>
  (function() {
    var EFFECTS = [
      { id: 'absorption', name: 'Absorption', icon: '💛', type: 'positive', desc: 'Absorbs hearts of damage', instant: false, maxDuration: 120 },
      { id: 'bad_omen', name: 'Bad Omen', icon: '⚠️', type: 'negative', desc: 'Triggers a raid when entering a village', instant: false, maxDuration: 600 },
      { id: 'blindness', name: 'Blindness', icon: '🙈', type: 'negative', desc: 'Blinds the target, limits vision', instant: false, maxDuration: 120 },
      { id: 'conduit_power', name: 'Conduit Power', icon: '🌊', type: 'positive', desc: 'Underwater breathing, haste, and resistance', instant: false, maxDuration: 360 },
      { id: 'darkness', name: 'Darkness', icon: '🌑', type: 'negative', desc: 'Darkens vision (Warden effect)', instant: false, maxDuration: 60 },
      { id: 'dolphin_grace', name: 'Dolphin\'s Grace', icon: '🐬', type: 'positive', desc: 'Swim faster near dolphins', instant: false, maxDuration: 60 },
      { id: 'fire_resistance', name: 'Fire Resistance', icon: '🔥', type: 'positive', desc: 'Immune to fire and lava damage', instant: false, maxDuration: 600 },
      { id: 'glowing', name: 'Glowing', icon: '✨', type: 'neutral', desc: 'Highlights the target through walls', instant: false, maxDuration: 60 },
      { id: 'haste', name: 'Haste', icon: '⛏️', type: 'positive', desc: 'Increases mining and attack speed', instant: false, maxDuration: 600 },
      { id: 'health_boost', name: 'Health Boost', icon: '❤️', type: 'positive', desc: 'Adds extra hearts', instant: false, maxDuration: 600 },
      { id: 'hero_of_the_village', name: 'Hero of the Village', icon: '🏆', type: 'positive', desc: 'Better trades from villagers', instant: false, maxDuration: 120 },
      { id: 'hunger', name: 'Hunger', icon: '🍖', type: 'negative', desc: 'Drains saturation and adds exhaustion', instant: false, maxDuration: 600 },
      { id: 'instant_damage', name: 'Instant Damage', icon: '💥', type: 'negative', desc: 'Deals instant damage', instant: true },
      { id: 'instant_health', name: 'Instant Health', icon: '💚', type: 'positive', desc: 'Restores instant health', instant: true },
      { id: 'invisibility', name: 'Invisibility', icon: '👻', type: 'positive', desc: 'Makes the target invisible', instant: false, maxDuration: 600 },
      { id: 'jump_boost', name: 'Jump Boost', icon: '🦘', type: 'positive', desc: 'Jump higher, reduce fall damage', instant: false, maxDuration: 600 },
      { id: 'levitation', name: 'Levitation', icon: '🎈', type: 'negative', desc: 'Floats the target upward', instant: false, maxDuration: 60 },
      { id: 'luck', name: 'Luck', icon: '🍀', type: 'positive', desc: 'Increases loot luck', instant: false, maxDuration: 600 },
      { id: 'mining_fatigue', name: 'Mining Fatigue', icon: '🪓', type: 'negative', desc: 'Slows mining speed', instant: false, maxDuration: 600 },
      { id: 'nausea', name: 'Nausea', icon: '🤢', type: 'negative', desc: 'Distorts vision', instant: false, maxDuration: 60 },
      { id: 'night_vision', name: 'Night Vision', icon: '👁️', type: 'positive', desc: 'See in complete darkness', instant: false, maxDuration: 600 },
      { id: 'poison', name: 'Poison', icon: '☠️', type: 'negative', desc: 'Deals damage over time', instant: false, maxDuration: 600 },
      { id: 'regeneration', name: 'Regeneration', icon: '💗', type: 'positive', desc: 'Regenerates health over time', instant: false, maxDuration: 600 },
      { id: 'resistance', name: 'Resistance', icon: '🛡️', type: 'positive', desc: 'Reduces all damage taken', instant: false, maxDuration: 600 },
      { id: 'saturation', name: 'Saturation', icon: '饱和', type: 'positive', desc: 'Restores hunger and saturation', instant: true },
      { id: 'slow_falling', name: 'Slow Falling', icon: '🪶', type: 'positive_desc', desc: 'Fall slowly, no fall damage', instant: false, maxDuration: 600 },
      { id: 'slowness', name: 'Slowness', icon: '🐌', type: 'negative', desc: 'Reduces movement speed', instant: false, maxDuration: 600 },
      { id: 'speed', name: 'Speed', icon: '💨', type: 'positive', desc: 'Increases movement speed', instant: false, maxDuration: 600 },
      { id: 'strength', name: 'Strength', icon: '💪', type: 'positive', desc: 'Increases melee damage', instant: false, maxDuration: 600 },
      { id: 'unlucky', name: 'Unlucky', icon: '🥀', type: 'negative', desc: 'Decreases loot luck', instant: false, maxDuration: 600 },
      { id: 'water_breathing', name: 'Water Breathing', icon: '🫧', type: 'positive', desc: 'Breathe underwater', instant: false, maxDuration: 600 },
      { id: 'weakness', name: 'Weakness', icon: '😩', type: 'negative', desc: 'Reduces melee damage', instant: false, maxDuration: 600 },
      { id: 'wither', name: 'Wither', icon: '💀', type: 'negative', desc: 'Deals wither damage over time', instant: false, maxDuration: 600 },
    ];

    var targetInput = document.getElementById('targetInput');
    var targetPresets = document.getElementById('targetPresets');
    var effectSearch = document.getElementById('effectSearch');
    var effectDropdown = document.getElementById('effectDropdown');
    var durationInput = document.getElementById('durationInput');
    var amplifierInput = document.getElementById('amplifierInput');
    var hideParticles = document.getElementById('hideParticles');
    var durationRow = document.getElementById('durationRow');
    var effectFields = document.getElementById('effectFields');
    var previewName = document.getElementById('previewName');
    var previewDesc = document.getElementById('previewDesc');
    var previewInfo = document.getElementById('previewInfo');
    var commandText = document.getElementById('commandText');
    var copyCmdBtn = document.getElementById('copyCmdBtn');
    var modeToggle = document.getElementById('modeToggle');

    var selectedEffect = null;
    var mode = 'give';

    // Target presets
    targetPresets.addEventListener('click', function(e) {
      var btn = e.target.closest('.target-preset');
      if (!btn) return;
      targetPresets.querySelectorAll('.target-preset').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      targetInput.value = btn.dataset.target;
      renderCommand();
    });

    // Mode toggle
    modeToggle.addEventListener('click', function(e) {
      var btn = e.target.closest('.clear-btn');
      if (!btn) return;
      modeToggle.querySelectorAll('.clear-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      mode = btn.dataset.mode;
      effectFields.style.display = mode === 'clear-all' ? 'none' : '';
      durationRow.style.display = mode === 'give' ? '' : 'none';
      renderCommand();
    });

    // Effect search/dropdown
    function renderDropdown(filter) {
      var f = (filter || '').toLowerCase();
      var filtered = EFFECTS.filter(function(e) {
        return !f || e.name.toLowerCase().includes(f) || e.id.includes(f);
      });
      effectDropdown.innerHTML = '';
      filtered.forEach(function(eff) {
        var opt = document.createElement('div');
        opt.className = 'effect-option' + (selectedEffect && selectedEffect.id === eff.id ? ' selected' : '');
        var typeName = eff.type === 'positive' ? 'positive' : eff.type === 'negative' ? 'negative' : 'neutral';
        opt.innerHTML = '<span class="eff-icon">' + eff.icon + '</span><span class="eff-name">' + eff.name + '</span><span class="eff-type">' + typeName + '</span>';
        opt.addEventListener('click', function() {
          selectedEffect = eff;
          effectSearch.value = eff.name;
          effectDropdown.classList.remove('open');
          durationRow.style.display = eff.instant ? 'none' : '';
          renderPreview();
          renderCommand();
        });
        effectDropdown.appendChild(opt);
      });
    }

    effectSearch.addEventListener('focus', function() {
      renderDropdown(effectSearch.value);
      effectDropdown.classList.add('open');
    });
    effectSearch.addEventListener('input', function() {
      renderDropdown(effectSearch.value);
      effectDropdown.classList.add('open');
    });
    document.addEventListener('click', function(e) {
      if (!e.target.closest('.effect-select-wrap')) effectDropdown.classList.remove('open');
    });

    // Duration / amplifier / particles
    [durationInput, amplifierInput, hideParticles].forEach(function(el) {
      el.addEventListener('input', renderCommand);
    });

    function renderPreview() {
      if (!selectedEffect) {
        previewName.textContent = 'Select an effect above';
        previewDesc.textContent = '';
        previewInfo.innerHTML = '';
        return;
      }
      var color = selectedEffect.type === 'positive' ? '#22c55e' : selectedEffect.type === 'negative' ? '#ef4444' : '#aaa';
      previewName.innerHTML = '<span>' + selectedEffect.icon + '</span> ' + selectedEffect.name;
      previewName.style.color = color;
      previewDesc.textContent = selectedEffect.desc;
      var info = '';
      if (!selectedEffect.instant) {
        info += '<span class="eff-info-item"><strong>Max Duration:</strong> ' + selectedEffect.maxDuration + 's</span>';
        info += '<span class="eff-info-item"><strong>Max Amplifier:</strong> 255 (level 256)</span>';
      } else {
        info += '<span class="eff-info-item"><strong>Type:</strong> Instant (duration/amplifier not applicable)</span>';
      }
      previewInfo.innerHTML = info;
    }

    function renderCommand() {
      var target = targetInput.value.trim() || '@s';
      var cmd = '';
      if (mode === 'clear-all') {
        cmd = '/effect ' + target + ' clear';
      } else if (mode === 'clear-one') {
        if (!selectedEffect) { cmd = '/effect ' + target + ' <effect> clear'; }
        else { cmd = '/effect ' + target + ' ' + selectedEffect.id + ' clear'; }
      } else {
        if (!selectedEffect) { cmd = '/effect ' + target + ' <effect> [duration] [amplifier] [hideParticles]'; return; }
        if (selectedEffect.instant) {
          cmd = '/effect ' + target + ' ' + selectedEffect.id;
        } else {
          var dur = parseInt(durationInput.value) || 30;
          var amp = parseInt(amplifierInput.value) || 0;
          var hide = hideParticles.checked ? 'true' : 'false';
          cmd = '/effect ' + target + ' ' + selectedEffect.id + ' ' + dur + ' ' + amp + ' ' + hide;
        }
      }
      commandText.textContent = cmd;
    }

    copyCmdBtn.addEventListener('click', function() {
      var text = commandText.textContent;
      if (!text) return;
      fallbackCopy(text);
    });

    function fallbackCopy(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(showOK).catch(fallback);
      } else { fallback(); }
      function fallback() {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); showOK(); } catch(e) {}
        document.body.removeChild(ta);
      }
      function showOK() {
        var t = document.createElement('div');
        t.className = 'toast';
        t.textContent = 'Copied!';
        document.body.appendChild(t);
        setTimeout(function() { t.classList.add('show'); }, 10);
        setTimeout(function() { t.classList.remove('show'); setTimeout(function() { t.remove(); }, 300); }, 2000);
      }
    }

    renderCommand();
  })();
  </script>
</body>
</html>

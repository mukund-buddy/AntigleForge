<!DOCTYPE html>

  <meta charset="UTF-8">

  <meta name="theme-color" content="#0a0a0f">
  <title>Loot Table Generator - AntigleForge</title>
  <link rel="canonical" href="https://antigleforge.pages.dev/tools/loot-table-generator">
  
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://antigleforge.pages.dev/tools/loot-table-generator">
  <meta property="og:title" content="Loot Table Generator - AntigleForge">
  <meta property="og:description" content="Generate Bedrock loot table JSON for addons.">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Favicon -->

  <style>
    .json-output {
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 0.8rem;
      max-height: 400px;
      overflow-y: auto;
    }
    .json-output pre {
      margin: 0;
      font-family: 'Inter', monospace;
      font-size: 0.75rem;
      color: #55ff55;
      white-space: pre;
      line-height: 1.5;
    }
    .pool-card {
      background: rgba(0,0,0,0.2);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px;
      padding: 0.75rem;
      margin-bottom: 0.75rem;
    }
    .pool-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.5rem;
    }
    .pool-title {
      font-family: 'Oxanium', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      color: #00ddff;
    }
    .pool-remove {
      background: none;
      border: none;
      color: rgba(255,255,255,0.2);
      cursor: pointer;
      padding: 4px;
    }
    .pool-remove:hover { color: #ff5555; }
    .entry-row {
      display: flex;
      gap: 0.4rem;
      align-items: center;
      margin-bottom: 0.4rem;
      flex-wrap: wrap;
    }
    .entry-row input, .entry-row select {
      font-size: 0.8rem;
    }
    .add-entry-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.3rem 0.6rem;
      border: 1px dashed rgba(255,255,255,0.15);
      border-radius: 5px;
      background: transparent;
      color: rgba(255,255,255,0.3);
      font-family: 'Oxanium', sans-serif;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.12s;
    }
    .add-entry-btn:hover { border-color: rgba(0,221,255,0.3); color: #00ddff; }
    .add-pool-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      width: 100%;
      padding: 0.6rem;
      border: 2px dashed rgba(255,255,255,0.1);
      border-radius: 8px;
      background: transparent;
      color: rgba(255,255,255,0.3);
      font-family: 'Oxanium', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      margin-bottom: 1rem;
    }
    .add-pool-btn:hover { border-color: rgba(0,221,255,0.3); color: #00ddff; }
    .form-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .form-row > * { flex: 1; min-width: 100px; }
    .copy-json-btn {
      position: sticky;
      top: 0;
      float: right;
      z-index: 2;
    }
    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      border: 1px solid rgba(34,197,94,0.3);
      background: rgba(34,197,94,0.1);
      color: #22c55e;
      font-family: 'Oxanium', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .download-btn:hover { background: rgba(34,197,94,0.2); }
  </style>
</head>
<body>

  <nav class="navbar" role="navigation" aria-label="Main navigation">
    <div class="navbar-container">
      <a href="../index.html" class="navbar-brand">
        <img src="../assets/images/logo.png" alt="AntigleForge" class="brand-logo">
        <span class="brand-text">Antigle<span class="brand-accent">Forge</span></span>
      </a>
      
      <button class="hamburger" id="hamburger" aria-label="Toggle menu" aria-expanded="false">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </button>
      
      <ul class="navbar-nav" id="navbar-nav">
        <li><a href="../index.html" class="nav-link">Home</a></li>
        <li><a href="../tools.html" class="nav-link active">Tools</a></li>
      </ul>
      
      <div class="navbar-actions">
        <a href="https://youtube.com/@notgamingplayz" target="_blank" rel="noopener noreferrer" class="btn btn-social" aria-label="YouTube">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.872.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.016 3.016 0 0 0 2.122-2.136c.502-1.884.502-5.814.502-5.814s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
          </svg>

  <!-- Main Content -->
  <main id="main-content" class="main-content">
    <section class="tool-page">
      <div class="container">
        <div class="tool-header reveal">
          <h1 class="tool-title">Loot Table Generator</h1>
          <p class="tool-subtitle">Generate Bedrock Edition loot table JSON for behavior packs and addons. No coding needed.</p>
        </div>

        <div class="tool-container">
          <!-- Config -->
          <div class="tool-card-main reveal stagger-1">
            <div class="tool-card-header">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
              </svg>
              Loot Table Configuration
            </div>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="namespaceInput">Namespace</label>
                <input type="text" id="namespaceInput" class="form-input" value="my_addon" placeholder="my_addon">
              </div>
              <div class="form-group">
                <label class="form-label" for="lootType">Loot Table Type</label>
                <select id="lootType" class="form-input">
                  <option value="block">Block loot</option>
                  <option value="entity">Entity loot</option>
                  <option value="chest">Chest loot</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="filePath">File path (relative to behavior pack)</label>
              <input type="text" id="filePath" class="form-input" value="loot_tables/blocks/my_block.json" placeholder="loot_tables/blocks/my_block.json">
            </div>
          </div>

          <!-- Pools -->
          <div class="tool-card-main reveal stagger-2">
            <div class="tool-card-header">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
              </svg>
              Loot Pools
            </div>

            <div id="poolsContainer"></div>

            <button class="add-pool-btn" id="addPoolBtn">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Add Pool
            </button>
          </div>

          <!-- Output -->
          <div class="tool-card-main reveal stagger-3">
            <div class="tool-card-header">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
              </svg>
              Generated JSON
              <div style="margin-left:auto;display:flex;gap:0.4rem;">
                <button class="btn btn-primary copy-json-btn" id="copyJsonBtn">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
                  Copy
                </button>
                <button class="download-btn" id="downloadBtn">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                  Download .json
                </button>
              </div>
            </div>
            <div class="json-output">
              <pre id="jsonOutput"></pre>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Scripts -->
  <script src="../assets/js/performance.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/components.js"></script>
  <script>
  AntigleComponents.init([
    { q: 'What is a loot table?', a: 'A loot table is a JSON file that defines what items drop from blocks, entities, or chests in Bedrock Edition. Each loot table can have multiple pools, and each pool can have multiple entries with different chances and quantities.' },
    { q: 'Where do I put the loot table file?', a: 'Place the loot table JSON in your behavior pack under the "loot_tables" folder. The file path should match what you specified in the block or entity definition (e.g., loot_tables/blocks/my_block.json).' },
    { q: 'What are pools and entries?', a: 'Pools are groups of possible drops. Each pool rolls once (or multiple times based on "rolls"). Entries within a pool are individual items that can drop, each with a weight (chance) and count range.' },
    { q: 'How do I set drop chances?', a: 'Each entry has a "weight" field. Higher weight means higher chance. For example, weight 10 is twice as likely as weight 5. The total weight of all entries in a pool determines the probability of each item dropping.' }
  ]);

  // Backup FAQ handler
  document.addEventListener('click', function(e) {
    var q = e.target.closest('.faq-question');
    if (!q) return;
    var item = q.parentElement;
    var wasOpen = item.classList.contains('open');
    item.parentElement.querySelectorAll('.faq-item').forEach(function(i) { i.classList.remove('open'); });
    if (!wasOpen) item.classList.add('open');
  });
  </script>
  <script>
  (function() {
    var poolsContainer = document.getElementById('poolsContainer');
    var addPoolBtn = document.getElementById('addPoolBtn');
    var jsonOutput = document.getElementById('jsonOutput');
    var copyJsonBtn = document.getElementById('copyJsonBtn');
    var downloadBtn = document.getElementById('downloadBtn');
    var namespaceInput = document.getElementById('namespaceInput');
    var lootType = document.getElementById('lootType');
    var filePath = document.getElementById('filePath');

    var pools = [];
    var poolId = 0;

    function addPool() {
      var id = poolId++;
      pools.push({
        id: id,
        rolls: 1,
        entries: [{ name: 'minecraft:diamond', countMin: 1, countMax: 1, weight: 1 }]
      });
      renderPools();
      renderJson();
    }

    function removePool(id) {
      pools = pools.filter(function(p) { return p.id !== id; });
      renderPools();
      renderJson();
    }

    function addEntry(poolId) {
      var pool = pools.find(function(p) { return p.id === poolId; });
      if (!pool) return;
      pool.entries.push({ name: 'minecraft:stone', countMin: 1, countMax: 1, weight: 1 });
      renderPools();
      renderJson();
    }

    function removeEntry(poolId, entryIdx) {
      var pool = pools.find(function(p) { return p.id === poolId; });
      if (!pool) return;
      pool.entries.splice(entryIdx, 1);
      if (pool.entries.length === 0) pool.entries.push({ name: 'minecraft:stone', countMin: 1, countMax: 1, weight: 1 });
      renderPools();
      renderJson();
    }

    function renderPools() {
      poolsContainer.innerHTML = '';
      pools.forEach(function(pool, pIdx) {
        var card = document.createElement('div');
        card.className = 'pool-card';
        var html = '<div class="pool-header"><span class="pool-title">Pool ' + (pIdx + 1) + '</span>';
        html += '<div style="display:flex;gap:0.4rem;align-items:center;">';
        html += '<label style="font-size:0.7rem;color:rgba(255,255,255,0.3);">Rolls:</label>';
        html += '<input type="number" class="form-input pool-rolls" data-pid="' + pool.id + '" value="' + pool.rolls + '" min="1" max="100" style="width:60px;font-size:0.8rem;">';
        html += '<button class="pool-remove" data-pid="' + pool.id + '"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>';
        html += '</div></div>';

        pool.entries.forEach(function(entry, eIdx) {
          html += '<div class="entry-row">';
          html += '<input type="text" class="form-input entry-name" data-pid="' + pool.id + '" data-eidx="' + eIdx + '" value="' + entry.name + '" placeholder="minecraft:item" style="flex:2;min-width:140px;font-size:0.8rem;">';
          html += '<input type="number" class="form-input entry-min" data-pid="' + pool.id + '" data-eidx="' + eIdx + '" value="' + entry.countMin + '" min="0" max="64" title="Min count" style="width:60px;font-size:0.8rem;">';
          html += '<span style="color:rgba(255,255,255,0.2);">to</span>';
          html += '<input type="number" class="form-input entry-max" data-pid="' + pool.id + '" data-eidx="' + eIdx + '" value="' + entry.countMax + '" min="0" max="64" title="Max count" style="width:60px;font-size:0.8rem;">';
          html += '<input type="number" class="form-input entry-weight" data-pid="' + pool.id + '" data-eidx="' + eIdx + '" value="' + entry.weight + '" min="1" max="1000" title="Weight" style="width:60px;font-size:0.8rem;">';
          html += '<button class="pool-remove entry-remove" data-pid="' + pool.id + '" data-eidx="' + eIdx + '"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>';
          html += '</div>';
        });

        html += '<button class="add-entry-btn" data-pid="' + pool.id + '">+ Add Entry</button>';
        card.innerHTML = html;
        poolsContainer.appendChild(card);
      });

      // Bind events
      poolsContainer.querySelectorAll('.pool-rolls').forEach(function(el) {
        el.addEventListener('input', function() {
          var pool = pools.find(function(p) { return p.id === parseInt(el.dataset.pid); });
          if (pool) pool.rolls = parseInt(el.value) || 1;
          renderJson();
        });
      });
      poolsContainer.querySelectorAll('.pool-remove').forEach(function(el) {
        el.addEventListener('click', function() {
          removePool(parseInt(el.dataset.pid));
        });
      });
      poolsContainer.querySelectorAll('.entry-name').forEach(function(el) {
        el.addEventListener('input', function() {
          var pool = pools.find(function(p) { return p.id === parseInt(el.dataset.pid); });
          if (pool && pool.entries[parseInt(el.dataset.eidx)]) {
            pool.entries[parseInt(el.dataset.eidx)].name = el.value;
            renderJson();
          }
        });
      });
      poolsContainer.querySelectorAll('.entry-min').forEach(function(el) {
        el.addEventListener('input', function() {
          var pool = pools.find(function(p) { return p.id === parseInt(el.dataset.pid); });
          if (pool && pool.entries[parseInt(el.dataset.eidx)]) {
            pool.entries[parseInt(el.dataset.eidx)].countMin = parseInt(el.value) || 1;
            renderJson();
          }
        });
      });
      poolsContainer.querySelectorAll('.entry-max').forEach(function(el) {
        el.addEventListener('input', function() {
          var pool = pools.find(function(p) { return p.id === parseInt(el.dataset.pid); });
          if (pool && pool.entries[parseInt(el.dataset.eidx)]) {
            pool.entries[parseInt(el.dataset.eidx)].countMax = parseInt(el.value) || 1;
            renderJson();
          }
        });
      });
      poolsContainer.querySelectorAll('.entry-weight').forEach(function(el) {
        el.addEventListener('input', function() {
          var pool = pools.find(function(p) { return p.id === parseInt(el.dataset.pid); });
          if (pool && pool.entries[parseInt(el.dataset.eidx)]) {
            pool.entries[parseInt(el.dataset.eidx)].weight = parseInt(el.value) || 1;
            renderJson();
          }
        });
      });
      poolsContainer.querySelectorAll('.add-entry-btn').forEach(function(el) {
        el.addEventListener('click', function() {
          addEntry(parseInt(el.dataset.pid));
        });
      });
      poolsContainer.querySelectorAll('.entry-remove').forEach(function(el) {
        el.addEventListener('click', function() {
          removeEntry(parseInt(el.dataset.pid), parseInt(el.dataset.eidx));
        });
      });
    }

    function renderJson() {
      var format_version = '1.16.0';
      var lootTable = {
        format_version: format_version,
        loot_tables: {}
      };
      var namespace = namespaceInput.value.trim() || 'my_addon';
      var type = lootType.value;
      var path = filePath.value.trim() || 'loot_tables/blocks/my_block.json';

      var tableObj = {
        type: type,
        pools: pools.map(function(pool) {
          return {
            rolls: { min: pool.rolls, max: pool.rolls },
            entries: pool.entries.map(function(entry) {
              var e = {
                type: 'item',
                name: entry.name,
                functions: [{
                  function: 'set_count',
                  count: { min: entry.countMin, max: entry.countMax }
                }]
              };
              return e;
            }),
            weight: 1
          };
        })
      };

      lootTable.loot_tables[namespace + ':' + path.replace('loot_tables/', '').replace('.json', '')] = tableObj;
      jsonOutput.textContent = JSON.stringify(lootTable, null, 2);
    }

    addPoolBtn.addEventListener('click', addPool);

    copyJsonBtn.addEventListener('click', function() {
      var text = jsonOutput.textContent;
      if (!text) return;
      fallbackCopy(text);
    });

    downloadBtn.addEventListener('click', function() {
      var text = jsonOutput.textContent;
      if (!text) return;
      var blob = new Blob([text], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filePath.value.trim().split('/').pop() || 'loot_table.json';
      a.click();
      URL.revokeObjectURL(url);
    });

    [namespaceInput, lootType, filePath].forEach(function(el) {
      el.addEventListener('input', renderJson);
    });

    function fallbackCopy(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(showOK).catch(fallback);
      } else { fallback(); }
      function fallback() {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); showOK(); } catch(e) {}
        document.body.removeChild(ta);
      }
      function showOK() {
        var t = document.createElement('div');
        t.className = 'toast';
        t.textContent = 'Copied!';
        document.body.appendChild(t);
        setTimeout(function() { t.classList.add('show'); }, 10);
        setTimeout(function() { t.classList.remove('show'); setTimeout(function() { t.remove(); }, 300); }, 2000);
      }
    }

    addPool();
  })();
  </script>
</body>

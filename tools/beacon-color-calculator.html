<style>
    .beacon-layout {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 1.5rem;
    }
    @media (max-width: 700px) { .beacon-layout { grid-template-columns: 1fr; } }
    
    .beam-preview {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
    }
    .beam-label {
      font-family: 'Oswald', sans-serif;
      font-size: 0.7rem;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: rgba(255,255,255,0.4);
      margin-bottom: 0.75rem;
    }
    .beam-display {
      width: 120px;
      height: 200px;
      margin: 0 auto 1rem;
      border-radius: 8px;
      border: 2px solid rgba(255,255,255,0.1);
      position: relative;
      overflow: hidden;
    }
    .beam-glow {
      position: absolute;
      inset: 0;
      filter: blur(20px);
      opacity: 0.6;
    }
    .beam-solid {
      position: absolute;
      inset: 20px;
      border-radius: 4px;
    }
    .beam-hex {
      font-family: 'Oswald', sans-serif;
      font-size: 1.5rem;
      font-weight: 400;
      color: rgba(255,255,255,0.9);
      margin-bottom: 0.3rem;
    }
    .beam-rgb {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.4);
    }
    
    .glass-stack {
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 1rem;
    }
    .stack-title {
      font-family: 'Oswald', sans-serif;
      font-size: 0.75rem;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: rgba(255,255,255,0.4);
      margin-bottom: 0.75rem;
    }
    .stack-layers {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-bottom: 1rem;
    }
    .stack-layer {
      display: grid;
      grid-template-columns: 60px 1fr auto;
      gap: 0.5rem;
      align-items: center;
      padding: 0.4rem 0.5rem;
      background: rgba(0,0,0,0.2);
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.04);
    }
    .layer-label {
      font-family: 'Oswald', sans-serif;
      font-size: 0.7rem;
      font-weight: 400;
      color: rgba(255,255,255,0.4);
    }
    .layer-color {
      width: 100%;
      height: 28px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.1);
      cursor: pointer;
    }
    .layer-remove {
      background: none;
      border: none;
      color: rgba(255,255,255,0.3);
      cursor: pointer;
      font-size: 1rem;
      padding: 0 0.3rem;
    }
    .layer-remove:hover { color: #d3241b; }
    
    .color-palette {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 0.3rem;
      margin-top: 0.75rem;
    }
    .color-swatch {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 4px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.15s;
    }
    .color-swatch:hover { border-color: rgba(255,255,255,0.4); transform: scale(1.1); }
    .color-swatch.selected { border-color: #e8b32d; }
    
    .color-name {
      font-size: 0.65rem;
      color: rgba(255,255,255,0.5);
      text-align: center;
      margin-top: 0.2rem;
    }
    
    .mixing-steps {
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .step {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.3rem 0;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.5);
    }
    .step-color {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      border: 1px solid rgba(255,255,255,0.1);
      flex-shrink: 0;
    }
    .step-arrow { color: rgba(255,255,255,0.2); }
    
    .preset-btns {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      margin-top: 0.75rem;
    }
    .preset-btn {
      padding: 0.3rem 0.6rem;
      border-radius: 5px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03);
      color: rgba(255,255,255,0.45);
      font-family: 'Oswald', sans-serif;
      font-size: 0.65rem;
      font-weight: 400;
      cursor: pointer;
      transition: all 0.15s;
    }
    .preset-btn:hover { border-color: rgba(232,179,45,0.25); color: rgba(255,255,255,0.7); }
  </style>

<h1 class="tool-title">Beacon Color Calculator</h1>

  <script>
  AntigleComponents.init([
    { "q": "How do I make a colored beacon beam?", "a": "Place a stained glass block directly above the beacon and the beam takes that glass color. Add more layers in this tool to preview how the stacked colors blend." },
    { "q": "How does the color mixing work?", "a": "Each layer is averaged with the previous one using its RGB values, so two layers give a 50/50 blend and more layers keep softening the color. Two or three layers are the easiest to predict in game." },
    { "q": "Why is my in-game beam a slightly different shade?", "a": "Bedrock and Java do not blend stacked glass the same way, and in-game lighting is not a plain RGB average. Use the swatch as a close guide, then confirm in a creative world." },
    { "q": "How many layers should I stack?", "a": "This tool accepts up to six layers. Past three or four the color usually turns muddy, so it becomes hard to tell your beam apart from a similar one." }
  ]);
  </script>

  <script>
  (function() {
    var GLASSES = [
      { name: 'White', hex: '#F9FFFE', r: 249, g: 255, b: 254 },
      { name: 'Orange', hex: '#F9801D', r: 249, g: 128, b: 29 },
      { name: 'Magenta', hex: '#C74EBD', r: 199, g: 78, b: 189 },
      { name: 'Light Blue', hex: '#3AB3DA', r: 58, g: 179, b: 218 },
      { name: 'Yellow', hex: '#FED83D', r: 254, g: 216, b: 61 },
      { name: 'Lime', hex: '#80C71F', r: 128, g: 199, b: 31 },
      { name: 'Pink', hex: '#F38BAA', r: 243, g: 139, b: 170 },
      { name: 'Gray', hex: '#474F52', r: 71, g: 79, b: 82 },
      { name: 'Light Gray', hex: '#9D9D97', r: 157, g: 157, b: 151 },
      { name: 'Cyan', hex: '#169C9C', r: 22, g: 156, b: 156 },
      { name: 'Purple', hex: '#8932B8', r: 137, g: 50, b: 184 },
      { name: 'Blue', hex: '#3C44AA', r: 60, g: 68, b: 170 },
      { name: 'Brown', hex: '#835432', r: 131, g: 84, b: 50 },
      { name: 'Green', hex: '#5E7C16', r: 94, g: 124, b: 22 },
      { name: 'Red', hex: '#B02E26', r: 176, g: 46, b: 38 },
      { name: 'Black', hex: '#1D1D21', r: 29, g: 29, b: 33 }
    ];
    
    var PRESETS = {
      'pink': [14, 0],       // Red, White
      'teal': [9, 11],       // Cyan, Blue
      'gold': [1, 4],        // Orange, Yellow
      'dark-purple': [10, 15, 10] // Purple, Black, Purple
    };
    
    var MAX_LAYERS = 6;
    var stack = []; // Array of glass indices
    
    function toHex(r, g, b) {
      return '#' + [r, g, b].map(function(v) {
        var h = Math.round(Math.max(0, Math.min(255, v))).toString(16);
        return h.length === 1 ? '0' + h : h;
      }).join('').toUpperCase();
    }
    
    function mixColors(bottom, top) {
      return {
        r: (bottom.r + top.r) / 2,
        g: (bottom.g + top.g) / 2,
        b: (bottom.b + top.b) / 2
      };
    }
    
    function calculateBeam() {
      if (stack.length === 0) {
        return { r: 249, g: 255, b: 254 }; // Default white
      }
      
      var beam = {
        r: GLASSES[stack[0]].r,
        g: GLASSES[stack[0]].g,
        b: GLASSES[stack[0]].b
      };
      
      for (var i = 1; i < stack.length; i++) {
        beam = mixColors(beam, GLASSES[stack[i]]);
      }
      
      return beam;
    }
    
    function renderStack() {
      var container = document.getElementById('stackLayers');
      container.innerHTML = '';
      
      for (var i = 0; i < MAX_LAYERS; i++) {
        var layer = document.createElement('div');
        layer.className = 'stack-layer';
        
        var label = document.createElement('span');
        label.className = 'layer-label';
        label.textContent = 'Layer ' + (i + 1);
        
        var colorBtn = document.createElement('button');
        colorBtn.className = 'layer-color';
        if (i < stack.length) {
          colorBtn.style.background = GLASSES[stack[i]].hex;
          colorBtn.title = GLASSES[stack[i]].name;
        } else {
          colorBtn.style.background = 'rgba(255,255,255,0.05)';
          colorBtn.title = 'Click a color below to add';
        }
        colorBtn.dataset.layer = i;
        colorBtn.addEventListener('click', function() {
          var layerIdx = parseInt(this.dataset.layer);
          if (layerIdx < stack.length) {
            stack.splice(layerIdx, 1);
            renderStack();
            updateBeam();
          }
        });
        
        var removeBtn = document.createElement('button');
        removeBtn.className = 'layer-remove';
        removeBtn.textContent = '×';
        removeBtn.dataset.layer = i;
        removeBtn.addEventListener('click', function() {
          var layerIdx = parseInt(this.dataset.layer);
          if (layerIdx < stack.length) {
            stack.splice(layerIdx, 1);
            renderStack();
            updateBeam();
          }
        });
        
        layer.appendChild(label);
        layer.appendChild(colorBtn);
        layer.appendChild(removeBtn);
        container.appendChild(layer);
      }
    }
    
    function renderPalette() {
      var container = document.getElementById('colorPalette');
      container.innerHTML = '';
      
      GLASSES.forEach(function(glass, idx) {
        var wrapper = document.createElement('div');
        
        var swatch = document.createElement('button');
        swatch.className = 'color-swatch';
        swatch.style.background = glass.hex;
        swatch.title = glass.name;
        swatch.dataset.idx = idx;
        swatch.addEventListener('click', function() {
          var glassIdx = parseInt(this.dataset.idx);
          if (stack.length < MAX_LAYERS) {
            stack.push(glassIdx);
            renderStack();
            updateBeam();
          }
        });
        
        var name = document.createElement('div');
        name.className = 'color-name';
        name.textContent = glass.name;
        
        wrapper.appendChild(swatch);
        wrapper.appendChild(name);
        container.appendChild(wrapper);
      });
    }
    
    function updateBeam() {
      var beam = calculateBeam();
      var hex = toHex(beam.r, beam.g, beam.b);
      
      document.getElementById('beamGlow').style.background = hex;
      document.getElementById('beamSolid').style.background = hex;
      document.getElementById('beamHex').textContent = hex;
      document.getElementById('beamRgb').textContent = 
        Math.round(beam.r) + ', ' + Math.round(beam.g) + ', ' + Math.round(beam.b);
      
      // Mixing steps
      var stepsContainer = document.getElementById('mixingSteps');
      stepsContainer.innerHTML = '';
      
      if (stack.length === 0) {
        stepsContainer.innerHTML = '<div class="step">No glass — default white beam</div>';
        return;
      }
      
      var current = { r: GLASSES[stack[0]].r, g: GLASSES[stack[0]].g, b: GLASSES[stack[0]].b };
      
      var step0 = document.createElement('div');
      step0.className = 'step';
      step0.innerHTML = '<span class="step-color" style="background:' + GLASSES[stack[0]].hex + '"></span>' +
        '<span>Base: ' + GLASSES[stack[0]].name + ' (' + GLASSES[stack[0]].hex + ')</span>';
      stepsContainer.appendChild(step0);
      
      for (var i = 1; i < stack.length; i++) {
        var before = { r: current.r, g: current.g, b: current.b };
        current = mixColors(current, GLASSES[stack[i]]);
        var afterHex = toHex(current.r, current.g, current.b);
        
        var step = document.createElement('div');
        step.className = 'step';
        step.innerHTML = '<span class="step-color" style="background:' + GLASSES[stack[i]].hex + '"></span>' +
          '<span>+ ' + GLASSES[stack[i]].name + ' → ' + afterHex + '</span>';
        stepsContainer.appendChild(step);
      }
    }
    
    // Preset buttons
    document.querySelectorAll('.preset-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var preset = PRESETS[this.dataset.preset];
        if (preset) {
          stack = preset.slice();
          renderStack();
          updateBeam();
        }
      });
    });
    
    // Initialize
    renderPalette();
    renderStack();
    updateBeam();
  })();
  </script>

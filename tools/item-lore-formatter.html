<head>

  <meta name="description" content="Format Minecraft item lore with colors and formatting. Generate /give commands with custom lore for Bedrock and Java.">

  <style>
    .lore-line {
      display: flex;
      gap: 0.4rem;
      align-items: center;
      margin-bottom: 0.4rem;
    }
    .lore-line input { flex: 1; }
    .lore-remove {
      background: none;
      border: none;
      color: rgba(255,255,255,0.2);
      cursor: pointer;
      padding: 4px;
    }
    .lore-remove:hover { color: #ff5555; }
    .color-row {
      display: flex;
      gap: 0.3rem;
      flex-wrap: wrap;
      margin-bottom: 0.75rem;
    }
    .cchip {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.12);
      cursor: pointer;
      transition: all 0.1s;
    }
    .cchip:hover { transform: scale(1.15); border-color: #fff; }
    .preview-box {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 1rem;
      margin: 1rem 0;
      min-height: 60px;
    }
    .preview-line {
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      line-height: 1.5;
    }
    .output-box {
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 0.8rem;
      position: relative;
    }
    .output-box pre {
      margin: 0;
      font-family: 'Inter', monospace;
      font-size: 0.75rem;
      color: #55ff55;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .item-input-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .item-input-row > * { flex: 1; min-width: 120px; }
  </style>
</head>
<body>

  <nav class="navbar" role="navigation" aria-label="Main navigation">
    <div class="navbar-container">
      <a href="../index.html" class="navbar-brand">
        <img src="../assets/images/logo.png" alt="AntigleForge" class="brand-logo">
        <span class="brand-text">Antigle<span class="brand-accent">Forge</span></span>
      </a>
      
      <button class="hamburger" id="hamburger" aria-label="Toggle menu" aria-expanded="false">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </button>
      
      <ul class="navbar-nav" id="navbar-nav">
        <li><a href="../index.html" class="nav-link">Home</a></li>
        <li><a href="../tools.html" class="nav-link active">Tools</a></li>
      </ul>
      
      <div class="navbar-actions">
        <a href="https://youtube.com/@notgamingplayz" target="_blank" rel="noopener noreferrer" class="btn btn-social" aria-label="YouTube">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.872.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.016 3.016 0 0 0 2.122-2.136c.502-1.884.502-5.814.502-5.814s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
          </svg>

  <!-- Main Content -->
  <main id="main-content" class="main-content">
    <section class="tool-page">
      <div class="container">
        <div class="tool-header reveal">
          <h1 class="tool-title">Item Lore Formatter</h1>
          <p class="tool-subtitle">Format Minecraft item lore with colors and generate /give commands for Bedrock and Java Edition.</p>
        </div>

        <div class="tool-container">
          <!-- Editor -->
          <div class="tool-card-main reveal stagger-1">
            <div class="tool-card-header">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>
              </svg>
              Lore Editor
            </div>

            <div class="item-input-row">
              <div class="form-group">
                <label class="form-label" for="itemName">Item ID</label>
                <input type="text" id="itemName" class="form-input" value="minecraft:diamond_sword" placeholder="minecraft:diamond_sword">
              </div>
              <div class="form-group">
                <label class="form-label" for="itemCount">Count</label>
                <input type="number" id="itemCount" class="form-input" value="1" min="1" max="64">
              </div>
            </div>

            <!-- Colors -->
            <div class="color-row" id="colorRow"></div>

            <!-- Lore lines -->
            <div id="loreLines"></div>
            <button class="btn btn-primary" id="addLineBtn" style="margin-top:0.5rem;">+ Add Line</button>

            <!-- Preview -->
            <div class="preview-box" id="previewBox"></div>
          </div>

          <!-- Output -->
          <div class="tool-card-main reveal stagger-2">
            <div class="tool-card-header">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
              </svg>
              Generated Command
            </div>

            <div style="margin-bottom:0.75rem;">
              <label class="form-label" style="display:flex;align-items:center;gap:0.5rem;cursor:pointer;">
                <input type="checkbox" id="useCustomName" style="width:16px;height:16px;">
                Add Custom Name
              </label>
              <input type="text" id="customName" class="form-input" value="§6Legendary Sword" placeholder="§6Legendary Sword" style="margin-top:0.3rem;display:none;">
            </div>

            <div class="output-box">
              <pre id="commandOutput"></pre>
              <button class="btn btn-primary" id="copyBtn" style="position:absolute;top:0.5rem;right:0.5rem;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
                Copy
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Scripts -->
  <script src="../assets/js/performance.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/components.js"></script>
  <script>
  AntigleComponents.init([
    { q: 'What is item lore?', a: 'Lore is the descriptive text that appears below an item\'s name in the inventory. Each line of lore can have different colors and formatting using section codes (§).' },
    { q: 'How do I add colors to lore?', a: 'Click a color chip above the text input, then type your text. The color code (§a, §c, etc.) will be inserted. You can also type § followed by a color code manually.' },
    { q: 'Does this work on Bedrock?', a: 'Yes! The generated /give command works on both Java and Bedrock Edition. The section codes (§) are universal across both editions.' },
    { q: 'What items can have lore?', a: 'Any item can have lore applied via /give commands. This includes swords, pickaxes, armor, food, and custom items from addons.' }
  ]);

  // Backup FAQ handler
  document.addEventListener('click', function(e) {
    var q = e.target.closest('.faq-question');
    if (!q) return;
    var item = q.parentElement;
    var wasOpen = item.classList.contains('open');
    item.parentElement.querySelectorAll('.faq-item').forEach(function(i) { i.classList.remove('open'); });
    if (!wasOpen) item.classList.add('open');
  });
  </script>
  <script>
  (function() {
    var CODES = {
      '0': '#000000', '1': '#0000AA', '2': '#00AA00', '3': '#00AAAA',
      '4': '#AA0000', '5': '#AA00AA', '6': '#FFAA00', '7': '#AAAAAA',
      '8': '#555555', '9': '#5555FF', 'a': '#55FF55', 'b': '#55FFFF',
      'c': '#FF5555', 'd': '#FF55FF', 'e': '#FFFF55', 'f': '#FFFFFF'
    };
    var CODE_CHARS = Object.keys(CODES);

    var colorRow = document.getElementById('colorRow');
    var loreLines = document.getElementById('loreLines');
    var addLineBtn = document.getElementById('addLineBtn');
    var previewBox = document.getElementById('previewBox');
    var commandOutput = document.getElementById('commandOutput');
    var itemName = document.getElementById('itemName');
    var itemCount = document.getElementById('itemCount');
    var useCustomName = document.getElementById('useCustomName');
    var customName = document.getElementById('customName');
    var copyBtn = document.getElementById('copyBtn');

    var lines = ['§7A powerful sword'];

    // Build color chips
    CODE_CHARS.forEach(function(c) {
      var chip = document.createElement('div');
      chip.className = 'cchip';
      chip.style.backgroundColor = CODES[c];
      chip.title = '§' + c;
      chip.addEventListener('click', function() {
        var active = document.querySelector('.lore-lines .lore-line:last-child input');
        if (!active && lines.length > 0) active = loreLines.querySelector('input[data-idx="' + (lines.length - 1) + '"]');
        if (active) {
          var idx = parseInt(active.dataset.idx);
          lines[idx] = (lines[idx] || '') + '§' + c;
          active.value = lines[idx];
          render();
        }
      });
      colorRow.appendChild(chip);
    });

    function renderLines() {
      loreLines.innerHTML = '';
      lines.forEach(function(line, idx) {
        var row = document.createElement('div');
        row.className = 'lore-line';
        row.innerHTML =
          '<input type="text" class="form-input lore-input" data-idx="' + idx + '" value="' + escHtml(line) + '" placeholder="Line ' + (idx + 1) + '...">' +
          '<button class="lore-remove" data-idx="' + idx + '">' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
          '</button>';
        loreLines.appendChild(row);
      });

      loreLines.querySelectorAll('.lore-input').forEach(function(el) {
        el.addEventListener('input', function() {
          lines[parseInt(el.dataset.idx)] = el.value;
          render();
        });
      });
      loreLines.querySelectorAll('.lore-remove').forEach(function(el) {
        el.addEventListener('click', function() {
          lines.splice(parseInt(el.dataset.idx), 1);
          if (lines.length === 0) lines.push('');
          renderLines();
          render();
        });
      });
    }

    addLineBtn.addEventListener('click', function() {
      lines.push('');
      renderLines();
    });

    useCustomName.addEventListener('change', function() {
      customName.style.display = useCustomName.checked ? '' : 'none';
      render();
    });
    customName.addEventListener('input', render);
    itemName.addEventListener('input', render);
    itemCount.addEventListener('input', render);

    function render() {
      // Preview
      var html = '';
      lines.forEach(function(line) { html += '<div class="preview-line">' + colorize(line) + '</div>'; });
      previewBox.innerHTML = html || '<span style="color:rgba(255,255,255,0.2);">Add lore lines above...</span>';

      // Generate command
      var item = itemName.value.trim() || 'minecraft:diamond_sword';
      var count = parseInt(itemCount.value) || 1;
      var name = useCustomName.checked ? customName.value.trim() : '';
      var loreStr = lines.filter(function(l) { return l.length > 0; }).join('\\n');

      var cmd = '/give @s ' + item + ' ' + count;
      if (name || loreStr) {
        cmd += ' {';
        var parts = [];
        if (name) parts.push('display:{Name:\'{"text":"' + name.replace(/§/g, '\\u00A7') + '"}\'}');
        if (loreStr) parts.push('display:{Lore:[\'' + lines.filter(function(l) { return l.length > 0; }).map(function(l) { return '{"text":"' + l.replace(/§/g, '\\u00A7') + '"}'; }).join(',') + '\']}');
        if (parts.length > 0) cmd += parts[0];
        cmd += '}';
      }

      commandOutput.textContent = cmd;
    }

    function colorize(str) {
      var result = '';
      var i = 0;
      var color = '#fff';
      while (i < str.length) {
        if (str[i] === '§' && i + 1 < str.length && CODES[str[i + 1].toLowerCase()]) {
          color = CODES[str[i + 1].toLowerCase()];
          i += 2;
          continue;
        }
        var ch = str[i];
        if (ch === '<') ch = '&lt;';
        else if (ch === '>') ch = '&gt;';
        result += '<span style="color:' + color + ';">' + ch + '</span>';
        i++;
      }
      return result;
    }

    function escHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    copyBtn.addEventListener('click', function() {
      var text = commandOutput.textContent;
      if (!text) return;
      fallbackCopy(text);
    });

    function fallbackCopy(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(showOK).catch(fallback);
      } else { fallback(); }
      function fallback() {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); showOK(); } catch(e) {}
        document.body.removeChild(ta);
      }
      function showOK() {
        var t = document.createElement('div');
        t.className = 'toast';
        t.textContent = 'Copied!';
        document.body.appendChild(t);
        setTimeout(function() { t.classList.add('show'); }, 10);
        setTimeout(function() { t.classList.remove('show'); setTimeout(function() { t.remove(); }, 300); }, 2000);
      }
    }

    renderLines();
    render();
  })();
  </script>
</body>

                    <div class="tool-badges"><span class="badge">MINECRAFT TOOL · FREE</span></div>
<h1 class="tool-title">UUID Generator</h1>

<!-- Scripts -->
  <script src="../assets/js/performance.js?v=5"></script>
  <script src="../assets/js/main.js?v=5"></script>
  <script src="../assets/js/components.js?v=5"></script>
  <script>
    AntigleComponents.init([
    { q: 'What is a UUID v4?', a: 'UUID v4 is a random unique identifier used in Minecraft resource packs, behavior packs, and addons for manifest files. Each UUID is completely unique.' },
    { q: 'How many UUIDs can I generate?', a: 'You can generate 1 to 50 UUIDs at once. Click "Generate" as many times as you need.' },
    { q: 'How do I use it in a manifest file?', a: 'Copy the UUID and paste it into your manifest.json — you need different UUIDs for "header.uuid" and "modules[].uuid". Never use the same UUID for both!' }
  ]);
  </script>
  <script>
  (function() {
    const display = document.getElementById('uuid-display');
    const genBtn = document.getElementById('uuid-generate-btn');
    const copyBtn = document.getElementById('uuid-copy-btn');
    const countInput = document.getElementById('uuid-count');
    const historyDiv = document.getElementById('uuid-history');
    const historyList = document.getElementById('uuid-history-list');
    let history = [];

    function generateUUID() {
      if (window.crypto && crypto.randomUUID) {
        return crypto.randomUUID();
      }
      if (window.crypto && crypto.getRandomValues) {
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
          const r = crypto.getRandomValues(new Uint8Array(1))[0] & 15;
          return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
        });
      }
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
        const r = Math.random() * 16 | 0;
        return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
      });
    }

    function generate() {
      const n = Math.min(Math.max(parseInt(countInput.value) || 1, 1), 50);
      const uuids = [];
      for (let i = 0; i < n; i++) {
        uuids.push(generateUUID());
      }
      display.textContent = uuids.join('\n');
      history.unshift({ time: new Date(), uuids: uuids.slice(0, 3) });
      if (history.length > 10) history.pop();
      renderHistory();
    }

    function renderHistory() {
      if (history.length === 0) {
        historyDiv.style.display = 'none';
        return;
      }
      historyDiv.style.display = 'block';
      historyList.innerHTML = '';
      history.forEach(h => {
        h.uuids.forEach(uuid => {
          const item = document.createElement('div');
          item.className = 'uuid-history-item';
          item.innerHTML = `
            <span>${uuid}</span>
            <button class="copy-hist" data-uuid="${uuid}">Copy</button>
          `;
          historyList.appendChild(item);
        });
      });
    }

    genBtn.addEventListener('click', generate);
    copyBtn.addEventListener('click', () => {
      const text = display.textContent;
      if (text && text !== 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx') {
        fallbackCopy(text);
      }
    });
    
    historyList.addEventListener('click', function(e) {
      const btn = e.target.closest('.copy-hist');
      if (!btn) return;
      fallbackCopy(btn.dataset.uuid);
    });

    function fallbackCopy(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(showOK).catch(fallback);
      } else {
        fallback();
      }
      function fallback() {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); showOK(); } catch(e) {}
        document.body.removeChild(ta);
      }
      function showOK() {
        const t = document.createElement('div');
        t.className = 'toast';
        t.textContent = 'Copied!';
        document.body.appendChild(t);
        setTimeout(() => t.classList.add('show'), 10);
        setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 2000);
      }
    }
    
    generate();
  })();
  </script>
</body>

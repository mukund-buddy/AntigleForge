<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AntigleForge - Switch between Visual and Performance mode.">
  <meta name="author" content="Mukund">
  <meta name="theme-color" content="#0d0807">
  <title>Mode - AntigleForge</title>
  <link rel="canonical" href="https://antigleforge.pages.dev/mode">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://antigleforge.pages.dev/mode">
  <meta property="og:title" content="Mode - AntigleForge">
  <meta property="og:description" content="Switch between Visual and Performance mode.">

  <link rel="icon" type="image/svg+xml" href="./assets/images/logo-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;600&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;600&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="./assets/css/theme.css?v=5">
</head>
<body>
  <div class="perf-indicator" id="perfIndicator">
    <span class="perf-icon">⚡</span>
    <span class="perf-text">Performance Mode</span>
  </div>

  <main class="mode-page">
    <div class="mode-container">
      <div class="mode-header">
        <div class="tool-badges"><span class="badge">DISPLAY SETTINGS</span></div>
        <h1 class="mode-title">Choose Mode</h1>
        <p class="mode-subtitle">Select how AntigleForge should run on your device.</p>
      </div>

      <div class="mode-cards">
        <button type="button" class="mode-card" id="cardVisual" data-mode="visual" aria-pressed="true">
          <div class="mode-card-header">
            <div class="mode-icon mode-icon-vm">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
              </svg>
            </div>
            <h2 class="mode-card-title">Visual Mode</h2>
          </div>
          <p class="mode-card-desc">Full visual experience with animations, transitions, and all visual effects enabled.</p>
          <div class="mode-features">
            <span class="mode-tag">Animations</span>
            <span class="mode-tag">Transitions</span>
            <span class="mode-tag">Glow effects</span>
            <span class="mode-tag">Smooth scroll</span>
            <span class="mode-tag">Card hover</span>
          </div>
        </button>

        <button type="button" class="mode-card" id="cardPerformance" data-mode="performance" aria-pressed="false">
          <div class="mode-card-header">
            <div class="mode-icon mode-icon-pm">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
              </svg>
            </div>
            <h2 class="mode-card-title">Performance Mode</h2>
          </div>
          <p class="mode-card-desc">Reduced visual workload for a smoother experience on lower-end devices.</p>
          <div class="mode-features">
            <span class="mode-tag">No animations</span>
            <span class="mode-tag">No transitions</span>
            <span class="mode-tag">No glow effects</span>
            <span class="mode-tag">Instant responses</span>
            <span class="mode-tag">Lightweight</span>
          </div>
        </button>
      </div>

      <div class="mode-status">
        <div class="mode-status-label">Current Mode</div>
        <div class="mode-status-value" id="currentMode">Visual Mode</div>
      </div>

      <a href="./index.html" class="mode-back">← Back to AntigleForge</a>
    </div>
  </main>

  <script>
  (function() {
    var STORAGE_KEY = 'antigleforge_perf_mode';
    var cardVisual = document.getElementById('cardVisual');
    var cardPerformance = document.getElementById('cardPerformance');
    var currentModeEl = document.getElementById('currentMode');

    function getMode() {
      try {
        return localStorage.getItem(STORAGE_KEY);
      } catch(e) {
        return null;
      }
    }

    function setMode(mode) {
      try {
        localStorage.setItem(STORAGE_KEY, mode);
      } catch(e) {}
    }

    function updateUI() {
      var mode = getMode();
      var performance = mode === 'true';

      cardVisual.classList.toggle('active', !performance);
      cardPerformance.classList.toggle('active', performance);
      cardVisual.setAttribute('aria-pressed', String(!performance));
      cardPerformance.setAttribute('aria-pressed', String(performance));

      currentModeEl.textContent = performance ? 'Performance Mode' : 'Visual Mode';
      currentModeEl.classList.toggle('mode-status-value--performance', performance);
      document.body.classList.toggle('performance-mode', performance);
    }

    cardVisual.addEventListener('click', function() {
      setMode('false');
      updateUI();
    });

    cardPerformance.addEventListener('click', function() {
      setMode('true');
      updateUI();
    });

    updateUI();
  })();
  </script>
</body>
</html>
